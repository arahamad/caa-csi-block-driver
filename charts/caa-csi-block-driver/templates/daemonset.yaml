{{- include "caa-csi.validateValues" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "caa-csi.fullname" . }}
  namespace: {{ include "caa-csi.namespace" . }}
  labels:
    {{- include "caa-csi.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "caa-csi.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "caa-csi.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "caa-csi.serviceAccountName" . }}
      containers:
        - name: csi-provisioner
          image: {{ .Values.sidecarImages.provisioner }}
          args:
            - "-v=3"
            - "--csi-address=/csi/csi.sock"
            - "--worker-threads=5"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with .Values.resources.provisioner }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: {{ .Values.nodePlugin.privileged }}
          volumeMounts:
            - mountPath: /csi
              name: socket-dir

        - name: node-driver-registrar
          image: {{ .Values.sidecarImages.nodeDriverRegistrar }}
          args:
            - "--v=3"
            - "--csi-address=/csi/csi.sock"
            - "--kubelet-registration-path={{ .Values.kubeletDir }}/plugins/caa-csi-block/csi.sock"
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          {{- with .Values.resources.nodeDriverRegistrar }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: {{ .Values.nodePlugin.privileged }}
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: /registration
              name: registration-dir

        - name: caa-csi-block-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--drivername={{ .Values.csiDriver.name }}"
            - "--endpoint=unix:///csi/csi.sock"
            - "--nodeid=$(KUBE_NODE_NAME)"
            {{- if eq .Values.provider "ibmcloud" }}
            - "--sidecarEndpoint=/sidecardir/provider.sock"
            {{- end }}
          env:
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: CSI_CLOUD_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: CSI_BOOTSTRAP_PARAMS_FILE
              value: /etc/caa-csi-block/bootstrap-params.json
            {{- if eq .Values.provider "aws" }}
            - name: AWS_REGION
              value: {{ required "aws.region is required when provider=aws" .Values.aws.region | quote }}
            {{- if and (not .Values.aws.irsa.enabled) .Values.aws.staticCredentials.enabled }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.staticCredentials.secretName }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.staticCredentials.secretName }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- end }}
            {{- end }}
            {{- if eq .Values.provider "ibmcloud" }}
            # the IBM volume library compares IKS_ENABLED against "True" exactly
            - name: IKS_ENABLED
              value: "True"
            - name: IKS_BLOCK_PROVIDER_NAME
              value: iks-vpc-classic
            - name: VPC_ENABLED
              value: "True"
            - name: VPC_BLOCK_PROVIDER_NAME
              value: vpc-classic
            - name: SECRET_CONFIG_PATH
              value: /etc/storage_ibmc
            {{- end }}
          {{- with .Values.resources.driver }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: {{ .Values.nodePlugin.privileged }}
          volumeMounts:
            - mountPath: /csi
              name: socket-dir
            - mountPath: {{ .Values.kubeletDir }}/pods
              name: mountpoint-dir
              mountPropagation: Bidirectional
            - mountPath: {{ .Values.kubeletDir }}/plugins
              name: plugins-dir
              mountPropagation: Bidirectional
            - mountPath: /run/kata-containers/shared/direct-volumes
              name: shared-directvols
            - mountPath: /var/lib/caa-csi-block
              name: csi-data
            - mountPath: /etc/caa-csi-block
              name: bootstrap-params
              readOnly: true
            {{- if eq .Values.provider "libvirt" }}
            - mountPath: {{ .Values.libvirt.volumeDir }}
              name: libvirt-pool
            {{- end }}
            {{- if eq .Values.provider "ibmcloud" }}
            - mountPath: /sidecardir
              name: secret-sidecar-sock-dir
            - mountPath: /etc/storage_ibmc
              name: customer-auth
              readOnly: true
            {{- end }}

        {{- if eq .Values.provider "ibmcloud" }}
        # issues short-lived IBM Cloud IAM tokens to the driver over provider.sock
        - name: storage-secret-sidecar
          image: {{ .Values.ibmcloud.secretSidecar.image }}
          args:
            - "--endpoint=unix:/sidecardir/provider.sock"
          env:
            - name: TOKEN_EXPIRY_DIFF
              value: 20m
            - name: PROFILE_CAPACITY
              value: "1"
          {{- with .Values.ibmcloud.secretSidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 2121
            runAsGroup: 2121
          volumeMounts:
            - mountPath: /sidecardir
              name: secret-sidecar-sock-dir
            - mountPath: /var/run/secrets/tokens
              name: vault-token
              readOnly: true
        {{- end }}

      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins/caa-csi-block
            type: DirectoryOrCreate
        - name: mountpoint-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/pods
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins_registry
            type: Directory
        - name: plugins-dir
          hostPath:
            path: {{ .Values.kubeletDir }}/plugins
            type: Directory
        - name: shared-directvols
          hostPath:
            path: /run/kata-containers/shared/direct-volumes/
            type: DirectoryOrCreate
        - name: csi-data
          hostPath:
            path: /var/lib/caa-csi-block
            type: DirectoryOrCreate
        - name: bootstrap-params
          configMap:
            name: {{ include "caa-csi.bootstrapConfigMapName" . }}
            optional: true
        {{- if eq .Values.provider "libvirt" }}
        - name: libvirt-pool
          hostPath:
            path: {{ .Values.libvirt.volumeDir }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq .Values.provider "ibmcloud" }}
        - name: secret-sidecar-sock-dir
          emptyDir: {}
        - name: customer-auth
          secret:
            secretName: storage-secret-store
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 600
        {{- end }}
