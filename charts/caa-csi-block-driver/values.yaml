# Cloud provider: aws, azure, ibmcloud, or libvirt
provider: aws

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/confidential-devhub/caa-csi-block-driver
  tag: 0.2.0
  pullPolicy: IfNotPresent

namespace:
  name: caa-csi-block
  create: true

sidecarImages:
  provisioner: registry.k8s.io/sig-storage/csi-provisioner:v3.6.0
  nodeDriverRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.9.0

csiDriver:
  name: caa-csi-block.csi.confidentialcontainers.io

# Kubelet root directory on the nodes. IBM Cloud IKS and ROKS on VPC use
# /var/data/kubelet.
kubeletDir: /var/lib/kubelet

# AWS provider settings
aws:
  region: ""
  # Optional. Pin EBS to this AZ. Recommended when CAA uses a single AWS_SUBNET_ID
  # (disk AZ must match the PodVM subnet). Omit only with WaitForFirstConsumer when
  # the PodVM AZ is the same as the worker node AZ.
  availabilityZone: ""
  volumeType: gp3
  irsa:
    enabled: false
    roleArn: ""
  staticCredentials:
    enabled: false
    secretName: caa-csi-aws-creds

# Azure provider settings
azure:
  subscriptionId: ""
  resourceGroup: ""
  location: ""
  diskSku: StandardSSD_LRS

# IBM Cloud VPC Block provider settings. The driver reads the
# storage-secret-store Secret and cluster-info ConfigMap from the release
# namespace; IKS and ROKS create both in kube-system only.
ibmcloud:
  region: ""
  zone: ""
  profile: general-purpose
  # resource group ID; empty uses the group from storage-secret-store
  resourceGroup: ""
  # only for the custom and sdp profiles
  iops: ""
  # Mbps, only for the sdp profile
  throughput: ""
  billingType: hourly
  encrypted: false
  # Key Protect or Hyper Protect key CRN, used when encrypted=true
  encryptionKey: ""
  # comma-separated extra tags for each volume
  tags: ""
  secretSidecar:
    image: icr.io/obs/armada-storage-secret:v1.3.64
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        cpu: 40m
        memory: 80Mi

# Libvirt provider settings
libvirt:
  volumeDir: /var/lib/caa-csi-volumes

# CDH encryption settings (optional, for LUKS via CAA).
# kbs-key-id is the KBS path without the kbs:/// prefix.
# Example: default/luks-key/volume-key
cdh:
  enabled: false
  encryptionType: luks2
  key: ""

storageClass:
  create: true
  name: ""
  reclaimPolicy: Delete
  volumeBindingMode: Immediate
  allowVolumeExpansion: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

resources:
  driver:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  provisioner:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeDriverRegistrar:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi

nodePlugin:
  privileged: true
