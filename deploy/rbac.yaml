apiVersion: v1
kind: ServiceAccount
metadata:
  name: caa-csi-provisioner
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: caa-csi-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  # The IBM provider reads its configuration from storage-secret-store.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["storage-secret-store"]
    verbs: ["get", "list", "watch"]
  # The IBM provider reads cluster metadata when IKS integration is enabled.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["cluster-info"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: caa-csi-provisioner-binding
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: caa-csi-provisioner-role
  apiGroup: rbac.authorization.k8s.io
---
# OpenShift requires explicit SCC authorization for the privileged driver and
# node registrar containers that access kubelet and Kata host paths.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: caa-csi-provisioner-privileged-scc
  namespace: kube-system
subjects:
  - kind: ServiceAccount
    name: caa-csi-provisioner
    namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
